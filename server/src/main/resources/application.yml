server:
  port: 5000

spring:
  application:
    name: hospital-management-server

  # Datasource: PostgreSQL
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/smart_hospital_management}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Ishan858#}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:hospital_management_secret_key_2026_super_secure_enterprise_key_aegiscare_demo}
    expiration-ms: 604800000 # 7 days
  gemini:
    api-key: ${GEMINI_API_KEY:}
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5173,http://localhost:3000}
